services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:${N8N_VERSION:?pin a version in .env, e.g. 2.49.7}
    restart: unless-stopped
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?run 'openssl rand -hex 32'}"
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Shanghai}
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Leadflow runtime config, read inside nodes via $env.*
      LEADFLOW_ICP_FIT_THRESHOLD: ${LEADFLOW_ICP_FIT_THRESHOLD:-0.6}
      LEADFLOW_OPENAI_MODEL: ${LEADFLOW_OPENAI_MODEL:-}
      LEADFLOW_AUDIT_SHEET_ID: ${LEADFLOW_AUDIT_SHEET_ID:-}
      LEADFLOW_SLACK_ALERT_CHANNEL: "${LEADFLOW_SLACK_ALERT_CHANNEL:-#ops-alerts}"
      LEADFLOW_SLACK_NOTIFY_CHANNEL: "${LEADFLOW_SLACK_NOTIFY_CHANNEL:-#leads}"
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-}
      # Code node allowlist: Validate & Normalize needs sha256 / randomUUID
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      # Execution data retention (spec 7.8)
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "all"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
